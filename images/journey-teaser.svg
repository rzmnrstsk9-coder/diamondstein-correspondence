<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="A stylized route map fanning out from a single point of origin">
  <title>Follow the Journey</title>
  <rect x="0" y="0" width="420" height="180" fill="#e8e4da"/>
  <g stroke="#1a1a1a" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="30" x2="420" y2="30"/>
    <line x1="0" y1="70" x2="420" y2="70"/>
    <line x1="0" y1="110" x2="420" y2="110"/>
    <line x1="0" y1="150" x2="420" y2="150"/>
  </g>
  <!-- routes fan out from "the Pale" (Korsovka) toward Montreal, London, Cape Town, and Jerusalem:
       the same 5 points and coordinates as the live map's own Scattering plate, projected onto a
       plain equirectangular grid (not a literal screenshot of the interactive map). -->
  <g fill="none" stroke-linecap="round">
    <path d="M242,33 Q185,20 124,44.5" stroke="#c1481f" stroke-width="1.6" stroke-dasharray="1.5,3"/>
    <path d="M242,33 Q228,15 210,38.5" stroke="#c1481f" stroke-width="1.6" stroke-dasharray="1.5,3"/>
    <path d="M242,33 Q260,80 231.5,124" stroke="#2a4a6a" stroke-width="1.6" stroke-dasharray="1.5,3"/>
    <path d="M242,33 Q270,45 251,58.2" stroke="#2a4a6a" stroke-width="1.6" stroke-dasharray="1.5,3"/>
  </g>
  <g>
    <circle cx="124" cy="44.5" r="4" fill="#c1481f"/>
    <circle cx="210" cy="38.5" r="4" fill="#c1481f"/>
    <circle cx="231.5" cy="124" r="4" fill="#2a4a6a"/>
    <circle cx="251" cy="58.2" r="4" fill="#2a4a6a"/>
    <circle cx="242" cy="33" r="5.5" fill="#8a6d2e" stroke="#e8e4da" stroke-width="1.5"/>
  </g>
</svg>
